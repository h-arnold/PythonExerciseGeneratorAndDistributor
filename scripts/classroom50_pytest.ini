# Trusted pytest configuration for a Classroom 50 grading bundle.
#
# This file is deliberately minimal and separate from the repository's broad root
# pytest.ini: the grader passes the manifest-listed hidden test paths and the
# configuration flags explicitly, so nothing here may widen or narrow the
# hidden-test grading boundary, and nothing here may import or depend on the
# student checkout.
[pytest]
addopts = -q
# The bundled hidden test modules carry the repository's exercise task marker, so
# the trusted configuration declares it instead of letting every graded run warn.
markers =
    task(taskno): marks the exercise task number
